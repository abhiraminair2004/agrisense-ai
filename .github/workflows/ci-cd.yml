name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Build client
        run: |
          cd client
          npm ci
          npm run build

      - name: Smoke test server entrypoint
        run: |
          cd server
          npm ci --omit=dev
          node --check app.js

      - name: Build model-service image
        run: docker compose build model-service

  docker_publish:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build deployable Docker images
        run: docker compose build client server model-service

      - name: Tag images with immutable SHA
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker tag agrisense-ai-client:latest "$DOCKERHUB_USERNAME/agrisense-ai-client:$IMAGE_SHA"
          docker tag agrisense-ai-server:latest "$DOCKERHUB_USERNAME/agrisense-ai-server:$IMAGE_SHA"
          docker tag agrisense-ai-model-service:latest "$DOCKERHUB_USERNAME/agrisense-ai-model-service:$IMAGE_SHA"

      - name: Push immutable image tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker push "$DOCKERHUB_USERNAME/agrisense-ai-client:$IMAGE_SHA"
          docker push "$DOCKERHUB_USERNAME/agrisense-ai-server:$IMAGE_SHA"
          docker push "$DOCKERHUB_USERNAME/agrisense-ai-model-service:$IMAGE_SHA"
